    # NEEDTOKNOW (hackathon) - TideCloak + app
    # Paste inside the http { } block of /root/MICROSERVICE_NGINX_SERVICE/nginx.conf
    # (Cloudflare-proxied, same origin cert pattern as the other *.dangpham.id.vn hosts.)
    server {
        listen 80;
        server_name tide.dangpham.id.vn ntk.dangpham.id.vn;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name tide.dangpham.id.vn;
        ssl_certificate /etc/letsencrypt/live/api.ngocrongdark.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.ngocrongdark.com/privkey.pem;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }
    server {
        listen 443 ssl;
        server_name ntk.dangpham.id.vn;
        ssl_certificate /etc/letsencrypt/live/api.ngocrongdark.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.ngocrongdark.com/privkey.pem;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        location /api/ {
            proxy_pass http://127.0.0.1:3101;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
        location / {
            proxy_pass http://127.0.0.1:3100;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_header;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
