# Runs on the VPS from /root/needtoknow. nginx (host) proxies tide./ntk.dangpham.id.vn to these ports.
# TideCloak runs as its own container (see docs/SETUP.md §1), on 127.0.0.1:8080 with
# KC_HOSTNAME=https://tide.dangpham.id.vn, KC_PROXY_HEADERS=xforwarded, data in ./tidecloak-data.
services:
  api:
    image: needtoknow-api:latest
    container_name: ntk-api
    restart: unless-stopped
    ports: ["127.0.0.1:3101:3101"]
    volumes:
      - ./api-data:/data
      - ./tidecloak.json:/config/tidecloak.json:ro
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ORIGINS: https://ntk.dangpham.id.vn
    mem_limit: 300m

  web:
    image: needtoknow-web:latest
    container_name: ntk-web
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 300m
