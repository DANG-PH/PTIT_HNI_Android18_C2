# Runs on the VPS from /root/needtoknow. nginx (host) proxies tide./ntk.dangpham.id.vn to these ports.
services:
  tidecloak:
    image: tideorg/tidecloak-dev:latest
    container_name: ntk-tidecloak
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./tidecloak-data:/opt/keycloak/data/h2"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: https://tide.dangpham.id.vn
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    mem_limit: 1400m

  api:
    image: needtoknow-api:latest
    container_name: ntk-api
    restart: unless-stopped
    ports: ["127.0.0.1:3101:3101"]
    volumes:
      - ./api-data:/data
      - ./tidecloak.json:/config/tidecloak.json:ro
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ORIGINS: https://ntk.dangpham.id.vn
    mem_limit: 300m

  web:
    image: needtoknow-web:latest
    container_name: ntk-web
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 300m
